name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: web
          run-install: true
      - name: Check
        run: cd web && vp run check
      - name: Build frontend 
        run: cd web && vp run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web
          if-no-files-found: error
          path: web/dist

  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' 
            target: 'aarch64-apple-darwin'
            name: 'macos_aarch64'
          - platform: 'macos-latest' 
            target: 'x86_64-apple-darwin'
            name: 'macos_x86_64'
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-musl'
            name: 'linux_x86_64'
          - platform: 'windows-latest'
            name: "windows_x86_64"
            target: "x86_64-pc-windows-msvc"
          
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install musl deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Build
        run: cargo build --target ${{ matrix.target }} --verbose --release
      - name: Run tests
        run: cargo test --verbose
      - name: Upload artifacts without extensions
        if: matrix.platform  != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: lucle_${{ matrix.name }}
          if-no-files-found: error
          path: target/${{ matrix.target }}/release/lucle
      - name: Upload artifacts with extensions
        if: matrix.platform  == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: lucle_${{ matrix.name }}
          if-no-files-found: error
          path: target/${{ matrix.target }}/release/lucle.exe

  backend_aarch64:
    runs-on: ubuntu-latest
    container: ghcr.io/blackdex/rust-musl:aarch64-musl
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lucle_arm64
          if-no-files-found: error
          path: target/aarch64-unknown-linux-musl/release/lucle
  
  build-container:
    runs-on: ubuntu-latest
    needs: [backend_aarchh64, backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: lucle_linux_*
      - name: Rename binaries
        run: mv lucle_linux_x86_64 lucle_amd64
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web/dist
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          push: ${{ github.event_name == 'push' && true || false }}
          tags: ludea/lucle:latest
          platforms: linux/amd64, linux/arm64

